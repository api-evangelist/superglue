            type: string
        - name: fileKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Download URL
          headers:
            X-Trace-Id:
              schema:
                type: string
              description: Request trace ID for debugging and log correlation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  fileKey:
                    type: string
